<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoVendas - Sistema de Vendas de Carros</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 12px 24px;
            border: none;
            background: #3498db;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .tab-button:hover, .tab-button.active {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 20px;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .car-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .car-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .car-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(45deg, #bdc3c7, #95a5a6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            color: #3498db;
        }

        .car-info {
            padding: 20px;
        }

        .car-name {
            font-size: 1.4em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .car-price {
            font-size: 1.8em;
            color: #27ae60;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .car-specs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #7f8c8d;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .sale-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .total-price {
            font-size: 2em;
            color: #27ae60;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.9);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #3498db;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 1.1em;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .nav-tabs {
                flex-direction: column;
                align-items: center;
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 AutoVendas Pro</h1>
            <p>Sistema Completo de Vendas de Carros</p>
            <div class="nav-tabs">
                <button class="tab-button active" onclick="showTab('estoque')">Estoque</button>
                <button class="tab-button" onclick="showTab('vendas')">Nova Venda</button>
                <button class="tab-button" onclick="showTab('historico')">Histórico</button>
                <button class="tab-button" onclick="showTab('relatorios')">Relatórios</button>
            </div>
        </header>

        <!-- ABA ESTOQUE -->
        <div id="estoque" class="tab-content active">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalCars">12</div>
                    <div class="stat-label">Carros em Estoque</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalValue">R$ 2,4M</div>
                    <div class="stat-label">Valor Total</div>
                </div>
            </div>
            <div class="grid" id="carGrid">
                <!-- Carros serão inseridos via JavaScript -->
            </div>
        </div>

        <!-- ABA VENDAS -->
        <div id="vendas" class="tab-content">
            <div class="sale-card">
                <h2>📋 Nova Venda</h2>
                <form id="saleForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Cliente:</label>
                            <input type="text" id="cliente" required>
                        </div>
                        <div class="form-group">
                            <label>CPF:</label>
                            <input type="text" id="cpf" placeholder="000.000.000-00" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Carro:</label>
                            <select id="carroSelect" required>
                                <option value="">Selecione um carro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Forma de Pagamento:</label>
                            <select id="pagamento" required>
                                <option value="">Selecione</option>
                                <option value="vista">À Vista</option>
                                <option value="parcelado">Parcelado</option>
                                <option value="financiamento">Financiamento</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Entrada (R$):</label>
                            <input type="number" id="entrada" min="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Parcelas:</label>
                            <input type="number" id="parcelas" min="1" max="60">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Observações:</label>
                        <textarea id="observacoes" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">✅ Concluir Venda</button>
                </form>
            </div>
            <div id="selectedCarInfo" style="display: none;" class="sale-card">
                <h3>Carro Selecionado</h3>
                <div id="carDetails"></div>
                <div class="total-price" id="totalPrice">R$ 0,00</div>
            </div>
        </div>

        <!-- ABA HISTÓRICO -->
        <div id="historico" class="tab-content">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalVendas">8</div>
                    <div class="stat-label">Total de Vendas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="vendasHoje">2</div>
                    <div class="stat-label">Vendas Hoje</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="faturamento">R$ 245.000</div>
                    <div class="stat-label">Faturamento Total</div>
                </div>
            </div>
            <div id="salesHistory" class="grid">
                <!-- Histórico será inserido via JavaScript -->
            </div>
        </div>

        <!-- ABA RELATÓRIOS -->
        <div id="relatorios" class="tab-content">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number">95%</div>
                    <div class="stat-label">Taxa de Conversão</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">R$ 32.500</div>
                    <div class="stat-label">Ticket Médio</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">4,8</div>
                    <div class="stat-label">Avaliação Média</div>
                </div>
            </div>
            <canvas id="salesChart" width="400" height="200"></canvas>
        </div>
    </div>

    <script>
        // Dados dos carros
        const cars = [
            { id: 1, name: 'Toyota Corolla XRE', price: 125000, year: 2024, km: 10, fuel: 'Híbrido' },
            { id: 2, name: 'Honda Civic EXL', price: 145000, year: 2023, km: 15000, fuel: 'Flex' },
            { id: 3, name: 'VW T-Cross Highline', price: 118000, year: 2024, km: 5, fuel: 'Flex' },
            { id: 4, name: 'Hyundai HB20 Platinum', price: 95000, year: 2024, km: 20, fuel: 'Flex' },
            { id: 5, name: 'Fiat Pulse Audace', price: 105000, year: 2024, km: 8, fuel: 'Flex' },
            { id: 6, name: 'Chevrolet Onix Premier', price: 98000, year: 2024, km: 12, fuel: 'Flex' },
            { id: 7, name: 'BMW X1 sDrive20i', price: 285000, year: 2023, km: 25000, fuel: 'Gasolina' },
            { id: 8, name: 'Audi Q3 35 TFSI', price: 265000, year: 2023, km: 18000, fuel: 'Gasolina' },
            { id: 9, name: 'Mercedes A200', price: 220000, year: 2024, km: 5000, fuel: 'Gasolina' },
            { id: 10, name: 'Jeep Renegade Longitude', price: 135000, year: 2024, km: 15, fuel: 'Flex' },
            { id: 11, name: 'Ford Bronco Sport', price: 195000, year: 2023, km: 12000, fuel: 'Gasolina' },
            { id: 12, name: 'Nissan Kicks Platinum', price: 128000, year: 2024, km: 30, fuel: 'Flex' }
        ];

        let sales = JSON.parse(localStorage.getItem('sales')) || [];

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            renderCars();
            updateStats();
            populateCarSelect();
            renderSalesHistory();
            setupEventListeners();
        });

        function showTab(tabName) {
            // Esconder todas as abas
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Mostrar aba selecionada
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function renderCars() {
            const grid = document.getElementById('carGrid');
            grid.innerHTML = '';

            cars.forEach(car => {
                const carCard = document.createElement('div');
                carCard.className = 'car-card';
                carCard.onclick = () => selectCar(car);
                
                carCard.innerHTML = `
                    <div class="car-image">🚗</div>
                    <div class="car-info">
                        <div class="car-name">${car.name}</div>
                        <div class="car-price">R$ ${formatPrice(car.price)}</div>
                        <div class="car-specs">
                            <span>${car.year} | ${formatKm(car.km)}</span>
                            <span>${car.fuel}</span>
                        </div>
                        <button class="btn btn-primary" onclick="event.stopPropagation(); selectCar(${car.id})">Selecionar</button>
                    </div>
                `;
                grid.appendChild(carCard);
            });
        }

        function selectCar(carId) {
            const car = cars.find(c => c.id === carId);
            if (!car) return;

            document.getElementById('carroSelect').value = car.id;
            showCarDetails(car);
        }

        function showCarDetails(car) {
            document.getElementById('carDetails').innerHTML = `
                <h4>${car.name}</h4>
                <p><strong>Preço:</strong> R$ ${formatPrice(car.price)}</p>
                <p><strong>Ano:</strong> ${car.year} | <strong>KM:</strong> ${formatKm(car.km)} | <strong>Combustível:</strong> ${car.fuel}</p>
            `;
            document.getElementById('totalPrice').textContent = `R$ ${formatPrice(car.price)}`;
            document.getElementById('selectedCarInfo').style.display = 'block';
            document.getElementById('entrada').max = car.price;
        }

        function populateCarSelect() {
            const select = document.getElementById('carroSelect');
            cars.forEach(car => {
                const option = document.createElement('option');
                option.value = car.id;
                option.textContent = `${car.name} - R$ ${formatPrice(car.price)}`;
                select.appendChild(option);
            });

            select.onchange = function() {
                const car = cars.find(c => c.id == this.value);
                if (car) {
                    showCarDetails(car);
                    document.getElementById('entrada').max = car.price;
                }
            };
        }

        document.getElementById('saleForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const sale = {
                id: Date.now(),
                date: new Date().toLocaleDateString('pt-BR'),
                cliente: document.getElementBy
